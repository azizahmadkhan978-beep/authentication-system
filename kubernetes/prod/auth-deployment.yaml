apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: authentication-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: authentication-system-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: development

            - name: APP_ENV
              value: prod

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET

            - name: JWT_EXPIRES_IN
              value: 1h

            - name: JWT_ISSUER
              value: auth-service

            - name: JWT_AUDIENCE
              value: resource-service