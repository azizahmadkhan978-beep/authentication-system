AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Authentication and RBAC serverless application

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 15

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection URL for the RDS database

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign and verify JWT tokens

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group used by both Lambda functions

  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets used by both Lambda functions

Resources:
  AuthApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ResourceApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "authentication-auth-service-${Environment}"
      CodeUri: auth-service/
      Handler: src/lambda.handler

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref LambdaSubnetIds

      Environment:
        Variables:
          NODE_ENV: production
          APP_ENV: !Ref Environment
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRES_IN: 1h
          JWT_ISSUER: auth-service
          JWT_AUDIENCE: resource-service

      Events:
        AuthRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Path: /
            Method: ANY

        AuthProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Path: /{proxy+}
            Method: ANY

  ResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "authentication-resource-service-${Environment}"
      CodeUri: resource-service/
      Handler: src/lambda.handler

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref LambdaSubnetIds

      Environment:
        Variables:
          NODE_ENV: production
          APP_ENV: !Ref Environment
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          JWT_ISSUER: auth-service
          JWT_AUDIENCE: resource-service

      Events:
        ResourceRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResourceApi
            Path: /
            Method: ANY

        ResourceProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResourceApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  AuthApiUrl:
    Description: Auth Service API URL
    Value: !Sub "https://${AuthApi}.execute-api.${AWS::Region}.amazonaws.com"

  ResourceApiUrl:
    Description: Resource Service API URL
    Value: !Sub "https://${ResourceApi}.execute-api.${AWS::Region}.amazonaws.com"

  DeploymentEnvironment:
    Description: Deployment environment
    Value: !Ref Environment